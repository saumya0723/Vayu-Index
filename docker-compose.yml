services:
  vayu-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    ports:
      - "${VAYU_BIND_ADDRESS:-127.0.0.1}:${VAYU_PUBLISH_PORT:-8000}:8000"
    environment:
      VAYU_HOST: 0.0.0.0
      VAYU_PORT: 8000
      PORT: 8000
      VAYU_ALLOWED_ORIGINS: ${VAYU_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      VAYU_LIVE_COLLECTION_DIR: /var/lib/vayu/live_collection
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      VAYU_SERPAPI_MAX_SEARCHES: ${VAYU_SERPAPI_MAX_SEARCHES:-150}
      VAYU_SERPAPI_MAX_HTTP_REQUESTS: ${VAYU_SERPAPI_MAX_HTTP_REQUESTS:-300}
      VAYU_SERPAPI_REQUEST_INTERVAL_SECONDS: ${VAYU_SERPAPI_REQUEST_INTERVAL_SECONDS:-0.5}
      VAYU_SERPAPI_RETENTION_HOURS: ${VAYU_SERPAPI_RETENTION_HOURS:-2}
      IGNAV_API_KEY: ${IGNAV_API_KEY:-}
      VAYU_IGNAV_MAX_SEARCHES: ${VAYU_IGNAV_MAX_SEARCHES:-150}
      VAYU_IGNAV_MAX_HTTP_REQUESTS: ${VAYU_IGNAV_MAX_HTTP_REQUESTS:-450}
      VAYU_IGNAV_REQUEST_INTERVAL_SECONDS: ${VAYU_IGNAV_REQUEST_INTERVAL_SECONDS:-0.25}
      VAYU_IGNAV_RETENTION_HOURS: ${VAYU_IGNAV_RETENTION_HOURS:-2}
      SKYSCANNER_API_KEY: ${SKYSCANNER_API_KEY:-}
      VAYU_SKYSCANNER_AUTHORIZED: ${VAYU_SKYSCANNER_AUTHORIZED:-false}
      VAYU_SKYSCANNER_DISPLAY_AUTHORIZED: ${VAYU_SKYSCANNER_DISPLAY_AUTHORIZED:-false}
      VAYU_SKYSCANNER_AUTHORIZATION_REFERENCE: ${VAYU_SKYSCANNER_AUTHORIZATION_REFERENCE:-}
      VAYU_SKYSCANNER_AUTHORIZATION_EXPIRY: ${VAYU_SKYSCANNER_AUTHORIZATION_EXPIRY:-}
      VAYU_SKYSCANNER_TERMS_REVIEW_DATE: ${VAYU_SKYSCANNER_TERMS_REVIEW_DATE:-}
      VAYU_SKYSCANNER_TERMS_VERSION: ${VAYU_SKYSCANNER_TERMS_VERSION:-}
      VAYU_SKYSCANNER_TERMS_SHA256: ${VAYU_SKYSCANNER_TERMS_SHA256:-}
      VAYU_SKYSCANNER_RETENTION_HOURS: ${VAYU_SKYSCANNER_RETENTION_HOURS:-}
      VAYU_SKYSCANNER_MAX_SEARCHES: ${VAYU_SKYSCANNER_MAX_SEARCHES:-150}
      VAYU_SKYSCANNER_MAX_HTTP_REQUESTS: ${VAYU_SKYSCANNER_MAX_HTTP_REQUESTS:-900}
      VAYU_SKYSCANNER_POLL_INTERVAL_SECONDS: ${VAYU_SKYSCANNER_POLL_INTERVAL_SECONDS:-1.5}
      VAYU_SKYSCANNER_MAX_POLLS: ${VAYU_SKYSCANNER_MAX_POLLS:-10}
    volumes:
      - vayu-live-quotes:/var/lib/vayu/live_collection

volumes:
  vayu-live-quotes:
